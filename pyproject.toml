[project]
name = "weak-rsa"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cysignals>=1.13.1",
    "fpylll>=0.6.4",
    "gmpy2>=2.3.2",
    "matplotlib>=3.11.2",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
]
sage = [
    "passagemath-standard>=10.8.13",
]

[tool.uv]
default-groups = ["dev", "sage"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rsaexp"
